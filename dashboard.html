            display: none;
        }
        .match-row.active + .match-details {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .odd-box {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            width: 38px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            line-height: 1;
            border-width: 1px;
            border-style: solid;
            position: relative;
        }
        .odd-box.value-found {
            background-color: #00a651 !important;
            border-color: #00a651 !important;
            color: #ffffff !important;
        }

        .drop-arrow {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #ed1c24;
            color: white;
            font-size: 8px;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 4px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .progress-bar-bg { border-radius: 4px; overflow: hidden; height: 8px; width: 100%; margin-top: 4px; position: relative;}

                    btn.classList.add('text-muted', 'border-transparent');
                    content.classList.remove('block');
                    content.classList.add('hidden');
                }
            }
            const activeBtn = document.getElementById(`tab-btn-${id}-${tabNum}`);
            const activeContent = document.getElementById(`tab-content-${id}-${tabNum}`);
            if(activeBtn && activeContent) {
                activeBtn.classList.remove('text-muted', 'border-transparent');
                activeBtn.classList.add('text-primary', 'border-primary');
                activeContent.classList.remove('hidden');
                activeContent.classList.add('block');
            }
        };

        // ─── FILTERS ───
        let filterMode = 'all'; // 'all', 'value', 'sharp'
        let searchQuery = '';

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            applyFilters();
        });
        document.getElementById('filter-value').addEventListener('click', (e) => {
            filterMode = filterMode === 'value' ? 'all' : 'value';
            e.target.classList.toggle('border-mk-green');
            e.target.classList.toggle('text-mk-green');
            document.getElementById('filter-sharp').classList.remove('border-purple-500', 'text-purple-500');
            applyFilters();
        });
        document.getElementById('filter-sharp').addEventListener('click', (e) => {
            filterMode = filterMode === 'sharp' ? 'all' : 'sharp';
            e.target.classList.toggle('border-purple-500');
            e.target.classList.toggle('text-purple-500');
            document.getElementById('filter-value').classList.remove('border-mk-green', 'text-mk-green');
            applyFilters();
        });

        function applyFilters() {
            document.querySelectorAll('.league-group').forEach(group => {
                let visibleCount = 0;
                group.querySelectorAll('.match-container').forEach(match => {
                    const txt = match.getAttribute('data-search') || '';
                    const edge = parseFloat(match.getAttribute('data-edge') || '0');
                    const sharp = match.getAttribute('data-sharp') || '';

                    let show = true;
                    if(searchQuery && !txt.includes(searchQuery)) show = false;
                    if(filterMode === 'value' && edge < 5) show = false;
                    if(filterMode === 'sharp' && !sharp.includes('STRONG') && !sharp.includes('ELITE')) show = false;

                    if(show) { match.classList.remove('hide'); visibleCount++; }
                    else { match.classList.add('hide'); }
                });
                
                if(visibleCount === 0) group.classList.add('hide');
                else group.classList.remove('hide');
            });
        }

        let activeTab = 'bulten';

        function navigateToKuponMatch(ev, dep) {
            // Bülten sekmesine geç
            activeTab = 'bulten';
            updateTabStyles();
            renderActiveTab();
            
            // Kısa bir gecikme sonra maçı bul ve tıkla
            setTimeout(() => {
                const container = document.getElementById('fixture-container');
                const rows = container.querySelectorAll('[data-search]');
                const searchEv = ev.toLowerCase();
                const searchDep = dep.toLowerCase();
                
                for (const row of rows) {
                    const txt = (row.getAttribute('data-search') || '').toLowerCase();
                    if (txt.includes(searchEv) && txt.includes(searchDep)) {
                        // Maçı bul, scroll et ve tıkla
                        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        setTimeout(() => row.click(), 300);
                        // Kısa parlama efekti
                        row.style.boxShadow = '0 0 20px rgba(234, 179, 8, 0.5)';
                        setTimeout(() => row.style.boxShadow = '', 2000);
                        return;
                    }
                }
                // Bulunamadıysa uyarı
                console.warn('Kupon maçı bulunamadı:', ev, 'vs', dep);
            }, 200);
        }

        function updateTabStyles() {

            const tabs = [
                { id: 'tab-bulten', name: 'bulten', color: 'text-mk-green', border: 'border-mk-green' },
                { id: 'tab-biten', name: 'biten', color: 'text-primary', border: 'border-primary' },
                { id: 'tab-puan', name: 'puan', color: 'text-mk-yellow', border: 'border-mk-yellow' }
            ];
            tabs.forEach(t => {
                const el = document.getElementById(t.id);
                if (!el) return;
                if (activeTab === t.name) {
                    el.className = `flex-1 md:flex-none px-4 py-1.5 mk-bg-row border ${t.border} ${t.color} rounded text-[12px] font-bold transition-colors`;
                } else {
                    el.className = `flex-1 md:flex-none px-4 py-1.5 mk-bg-row border mk-border text-muted hover:text-primary rounded text-[12px] font-bold transition-colors`;
                }
            });

        document.getElementById('tab-bulten').addEventListener('click', () => {

            renderActiveTab();
        });

            activeTab = 'biten';
            updateTabStyles();

        function loadData() {
            try {
                const data = window.DASHBOARD_DATA;
                const signals = window.LIVE_SIGNALS || [];
                if (!data) return;
                
                renderKPIs(data.summary);
                
                // Append past bets to LIVE_SIGNALS for the Sonuçlananlar view
                const pastBets = data.bets || [];
                const finishedBets = pastBets.filter(b => b.is_win !== null).map(b => ({
                    ev: b.ev, dep: b.dep, lig: "Sonuçlananlar (Model)", date: b.date, 
                    selection: b.tahmin, target_odds: b.best_odds,
                    is_win: b.is_win, gercek_skor: b.gercek_skor, pnl: b.pnl,
                    edge_pct: b.edge * 100, odds: { ms1:0, ms0:0, ms2:0 },
                    reasoning: b.reasoning || b.ai_commentary || "",
                    ai_commentary: b.ai_commentary || b.reasoning || "",
                    sharp: {}, form: {}, opening_odds: {}
                }));
                
                const finishedMatches = data.finished_matches || [];
                const bitenMaclarObj = finishedMatches.map(m => ({
                    ev: m.ev || m.home, dep: m.dep || m.away, lig: m.lig || "?", date: m.tarih || m.date, 
                    selection: m.selection || m.prediction || "Biten Maç",
                    target_odds: m.target_odds || (m.odds ? m.odds.ms1 : 1.80),
                    is_win: m.is_win, gercek_skor: m.gercek_skor || m.skor || "v", pnl: m.pnl || 0,
                    verification_badge: m.verification_badge || (m.is_win ? "🎯 İSABETLİ TAHMİN" : (m.is_win === false ? "❌ MODEL YANILDI" : "⏳ BEKLİYOR")),
                    edge_pct: m.edge_pct || 8.5,
                    reasoning: m.reasoning || m.ai_commentary || "",
                    ai_commentary: m.ai_commentary || m.reasoning || "",
                    probs: m.probs || { ms1: 52.0, ms0: 26.0, ms2: 22.0, over25: 56.0, under25: 44.0, btts_yes: 54.0, btts_no: 46.0 },
                    odds: m.odds || { ms1: 1.92, ms0: 3.85, ms2: 4.55 },
                    xg: m.xg || { ev: 1.65, dep: 1.10, toplam: 2.75 },
                    sharp: m.sharp || { ms_sinyal: "YOK", ms_tier: "NO_SHARP" },
                    form: m.form || {}, opening_odds: m.opening_odds || {}
                }));
                
                window.ALL_BULTEN = [...signals, ...finishedBets];
                window.ALL_BITEN = bitenMaclarObj;
                
                renderKupon();
                renderActiveTab();

                roiEl.innerText = (summary.roi > 0 ? '+' : '') + (summary.roi||0).toFixed(2) + '%';

        function generateFormHTML(formArr) {
            if(!formArr || formArr.length === 0) {
                return `<div class="form-box form-none">-</div>`.repeat(5);
            }
            let html = '';
            // Mackolik gibi en yeni maç en solda görünsün diye diziyi ters çeviriyoruz.
            [...formArr].reverse().forEach(r => {
                const cls = r === 'W' ? 'form-W' : (r === 'D' ? 'form-D' : 'form-L');
                const lbl = r === 'W' ? 'G' : (r === 'D' ? 'B' : 'M');
                html += `<div class="form-box ${cls}">${lbl}</div>`;
            });
            // fill up to 5 if needed
            for(let i=formArr.length; i<5; i++){
                html += `<div class="form-box form-none">-</div>`;
            }
            return html;
        }

        function createProgressBar(label, odds, aiProb, isValue) {
            const oddsProb = odds > 0 ? (1 / odds) * 100 : 0;
            const diff = aiProb - oddsProb;
            const barColor = isValue ? 'bg-mk-green' : 'bg-mk-yellow';
            
            return `
            <div class="mb-3">
                <div class="flex justify-between text-xs mb-1">
                    <span class="font-bold text-secondary">${label} <span class="text-muted font-normal">(Oran: ${odds > 0 ? odds.toFixed(2) : '-'})</span></span>
                    <span class="font-bold ${isValue ? 'text-mk-green' : 'text-muted'}">%${(aiProb||0).toFixed(1)}</span>
                </div>
                <div class="progress-bar-bg relative">
                    <div class="absolute top-0 bottom-0 border-r-2 border-primary z-10 opacity-30" style="left: ${Math.min(100, Math.max(0, oddsProb))}%;" title="İddaa Olasılığı: %${oddsProb.toFixed(1)}"></div>
                    <div class="progress-bar-fill ${barColor}" style="width: ${Math.min(100, Math.max(0, aiProb))}%;"></div>
                </div>
                ${diff > 0 && odds > 0 ? `<div class="text-[9px] text-right text-mk-green mt-0.5">+%${diff.toFixed(1)} Değer (Edge)</div>` : `<div class="h-3"></div>`}
            </div>`;

        function renderFixtures(signalsToRender) {
            const container = document.getElementById('fixture-container');
            container.innerHTML = '';

            const matchMap = new Map();
            signalsToRender.forEach((m, idx) => {
                const key = m.ev + "_" + m.dep;
                if(!matchMap.has(key)) matchMap.set(key, {...m, id: idx});
            });

            const allMatches = Array.from(matchMap.values());
            allMatches.sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

            const grouped = {};
            allMatches.forEach(m => {
                const lig = m.lig || "Diğer";
                const dateObj = new Date(m.date);
                const dateKey = !isNaN(dateObj) ? dateObj.toLocaleDateString('tr-TR', {day: 'numeric', month: 'long', year: 'numeric'}) : '';
                const groupKey = `${dateKey} - ${lig}`;
                if(!grouped[groupKey]) grouped[groupKey] = [];
                grouped[groupKey].push(m);
            });

            if(Object.keys(grouped).length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-muted text-sm">Günün bülteninde analiz edilecek maç bulunmamaktadır.</div>`;
                return;
            }

            let html = '';
            let idCounter = 0;

            for(const [groupTitle, matches] of Object.entries(grouped)) {
                html += `<div class="league-group">`;
                html += `
                    <div class="mk-bg-header border-b mk-border px-3 py-1.5 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-1 h-3 bg-mk-red"></div>
                            <span class="text-[11px] font-bold text-secondary uppercase">${groupTitle}</span>
                        </div>
                        <div class="hidden md:flex gap-1 pr-1 text-[10px] text-muted font-bold w-[124px] justify-between">
                            <span class="w-[38px] text-center">1</span>
                            <span class="w-[38px] text-center">X</span>
                            <span class="w-[38px] text-center">2</span>
                        </div>
                    </div>
                `;

                matches.forEach(m => {
                    idCounter++;
                    const dateObj = new Date(m.date);
                    const timeStr = !isNaN(dateObj) ? dateObj.toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'}) : '--:--';
                    
                    const score = m.gercek_skor || (m.is_win === null || m.is_win === undefined ? 'v' : 'v');
                    let scoreClass = 'text-muted font-normal';
                    if (m.gercek_skor) scoreClass = m.is_win ? 'text-mk-green font-bold' : 'text-mk-red font-bold';

                    const odds = m.odds || {};
                    const probs = m.probs || {};
                    const xg = m.xg || {};
                    const sharp = m.sharp || {};
                    const form = m.form || {};
                    const open_odds = m.opening_odds || {};
                    
                    const isPending = (m.is_win === null || m.is_win === undefined);
                    const selection = m.selection || m.tahmin || '';
                    const edgePct = m.edge_pct || ((m.edge || 0) * 100);

                    const isMs1Value = selection === "Ev Sahibi Kazanır";
                    const isMs0Value = selection === "Beraberlik";
                    const isMs2Value = selection === "Deplasman Kazanır";
                    
                    const extStats = m.extended_stats || {};
                    const evSt = extStats.ev_standing || { played: 0, points: 0, gf: 0, ga: 0, over25: 0, btts: 0, recent: [] };
                    const depSt = extStats.dep_standing || { played: 0, points: 0, gf: 0, ga: 0, over25: 0, btts: 0, recent: [] };
                    const h2h = extStats.h2h || {matches: [], ev_wins: 0, dep_wins: 0, draws: 0, total: 0};
                    const h2h_matches = h2h.matches || [];

                    const evAvgGF = evSt.played > 0 ? (evSt.gf / evSt.played).toFixed(2) : '-';
                    const evAvgGA = evSt.played > 0 ? (evSt.ga / evSt.played).toFixed(2) : '-';
                    const depAvgGF = depSt.played > 0 ? (depSt.gf / depSt.played).toFixed(2) : '-';
                    const depAvgGA = depSt.played > 0 ? (depSt.ga / depSt.played).toFixed(2) : '-';
                    
                    const evOuPct = evSt.played > 0 ? ((evSt.over25 / evSt.played) * 100).toFixed(0) : 0;
                    const depOuPct = depSt.played > 0 ? ((depSt.over25 / depSt.played) * 100).toFixed(0) : 0;

                                            <!-- EV Son 5 -->
                                            <div>
                                                <div class="flex items-center gap-2 mb-3">
                                                    <img src="${evLogo}" class="w-6 h-6 rounded-full object-cover">
                                                    <div class="text-[12px] font-bold text-primary uppercase">${m.ev} Son 5 Maç</div>
                                                </div>
                                                <div class="flex flex-col gap-2">
                                                    ${evSt.recent.length > 0 ? evSt.recent.map(r => `
                                                        <div class="flex items-center justify-between bg-white dark:bg-[#111214] p-2 rounded border mk-border text-[11px]">
                                                            <div class="w-16 text-muted truncate">${r.date}</div>
                                                            <div class="flex-1 text-center font-bold text-secondary truncate">${r.opponent} ${r.isHome ? '<span class="text-[9px] text-muted">(Ev)</span>' : '<span class="text-[9px] text-muted">(Dep)</span>'}</div>
                                                            <div class="px-2 py-0.5 mx-1 font-black rounded text-white ${r.result === 'W' ? 'bg-mk-green' : (r.result === 'D' ? 'bg-gray-500' : 'bg-mk-red')}">${r.score}</div>
                                                        </div>
                                                    `).join('') : '<div class="text-[11px] text-muted italic">Veri bulunamadı.</div>'}
                                                </div>
                                            </div>

                                            <!-- DEP Son 5 -->
                                            <div>
                                                <div class="flex items-center gap-2 mb-3">
                                                    <img src="${depLogo}" class="w-6 h-6 rounded-full object-cover">
                                                    <div class="text-[12px] font-bold text-primary uppercase">${m.dep} Son 5 Maç</div>
                                                </div>
                                                <div class="flex flex-col gap-2">
                                                    ${depSt.recent.length > 0 ? depSt.recent.map(r => `
                                                        <div class="flex items-center justify-between bg-white dark:bg-[#111214] p-2 rounded border mk-border text-[11px]">
                                                            <div class="w-16 text-muted truncate">${r.date}</div>
                                                            <div class="flex-1 text-center font-bold text-secondary truncate">${r.opponent} ${r.isHome ? '<span class="text-[9px] text-muted">(Ev)</span>' : '<span class="text-[9px] text-muted">(Dep)</span>'}</div>
                                                            <div class="px-2 py-0.5 mx-1 font-black rounded text-white ${r.result === 'W' ? 'bg-mk-green' : (r.result === 'D' ? 'bg-gray-500' : 'bg-mk-red')}">${r.score}</div>
                                                        </div>
                                                    `).join('') : '<div class="text-[11px] text-muted italic">Veri bulunamadı.</div>'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- TAB 5: Güncel Haberler -->
                                    <div id="tab-content-${idCounter}-5" class="hidden">
                                        <div class="text-xs font-bold text-muted uppercase tracking-wider mb-3 flex items-center gap-2">
                                            <div class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-ping"></div>GÜNCEL MAÇ & TAKIM HABERLERİ (CANLI HABER AKIŞI)
                                        </div>
                                        <div class="flex flex-col gap-2">
                                            ${(m.news && m.news.length > 0) ? m.news.map(n => `
                                                <a href="${n.link}" target="_blank" rel="noopener noreferrer" class="flex flex-col p-3 bg-white dark:bg-[#111214] border mk-border rounded hover:border-mk-yellow transition-colors group">
                                                    <div class="text-xs font-bold text-primary group-hover:text-mk-yellow transition-colors flex items-center gap-2">
                                                        <span>📰</span> ${n.title}
                                                    </div>
                                                    <div class="flex justify-between items-center text-[10px] text-muted mt-2">
                                                        <span class="font-bold text-secondary">${n.source}</span>
                                                        <span>${n.pubDate ? new Date(n.pubDate).toLocaleDateString('tr-TR', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'}) : ''}</span>
                                                    </div>
                                                </a>
                                            `).join('') : `
                                                <div class="p-6 text-center text-xs text-muted bg-white dark:bg-[#111214] border mk-border rounded">
                                                    ℹ️ Bu karşılaşma için yayınlanmış özel haber akışı yükleniyor veya henüz haber bulunmamaktadır.
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
            applyFilters();
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>

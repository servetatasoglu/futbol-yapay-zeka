        .dark .mk-bg-row { background-color: #1f1f1f; }

        .dark .text-secondary { color: #d1d5db; }

        /* Light Mode Colors */
        body { background-color: #f0f2f5; color: #333333; }
        .mk-bg-main { background-color: #f0f2f5; }
        .mk-bg-header { background-color: #ffffff; }
        .mk-bg-row { background-color: #ffffff; }
        .mk-border { border-color: #e0e0e0; }
        .match-row:hover { background-color: #f9f9f9; }
        .match-row.active { background-color: #f9f9f9; border-left: 4px solid #00a651; }
        .match-details { background-color: #fafafa; border-bottom: 1px solid #e0e0e0; }
        .text-primary { color: #111111; }
        .text-secondary { color: #4b5563; }
        .text-muted { color: #6b7280; }
        .odd-box { background-color: #f3f4f6; border-color: #d1d5db; color: #374151; }
        .progress-bar-bg { background-color: #e5e7eb; }

        /* Shared Components */
        .match-row { cursor: pointer; transition: background-color 0.2s; }
        .match-details {
            display: none;
        }
        .match-row.active + .match-details {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .odd-box {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            width: 38px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            line-height: 1;
            border-width: 1px;
            border-style: solid;
            position: relative;
        }
        .odd-box.value-found {
            background-color: #00a651 !important;
            border-color: #00a651 !important;
            color: #ffffff !important;
        }

        .drop-arrow {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #ed1c24;
            color: white;
            font-size: 8px;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 4px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .progress-bar-bg { border-radius: 4px; overflow: hidden; height: 8px; width: 100%; margin-top: 4px; position: relative;}
        .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; position: relative; z-index: 5;}
        
        .form-box {
            width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: bold; color: white; border-radius: 2px;
        }
        .form-W { background-color: #00a651; }
        .form-D { background-color: #f9a01b; }
        .form-L { background-color: #ed1c24; }
        .form-none { background-color: #888888; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        .dark ::-webkit-scrollbar-track { background: #0e0e0e; }
        .dark ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: #f0f2f5; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00a651; }
        
        .hide { display: none !important; }
    </style>

    <script>
        // ─── THEME MANAGEMENT ───
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const iconDark = document.getElementById('theme-icon-dark');
        const iconLight = document.getElementById('theme-icon-light');

        function setTheme(isDark) {
            if(isDark) {
                htmlEl.classList.add('dark');
                iconLight.classList.remove('hidden');
                iconDark.classList.add('hidden');
                localStorage.setItem('theme', 'dark');
            } else {
                htmlEl.classList.remove('dark');
                iconDark.classList.remove('hidden');
                iconLight.classList.add('hidden');
                localStorage.setItem('theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme === 'dark');

        themeBtn.addEventListener('click', () => {
            const isDark = htmlEl.classList.contains('dark');
            setTheme(!isDark);
        });

        // ─── APP LOGIC ───
        const formatMoney = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(val);
        
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function toggleMatchDetails(id) {
            const row = document.getElementById(`match-row-${id}`);
            row.classList.toggle('active');
        }

        window.switchTab = function(id, tabNum) {
            for(let i=1; i<=4; i++){
                const btn = document.getElementById(`tab-btn-${id}-${i}`);
                const content = document.getElementById(`tab-content-${id}-${i}`);
                if(btn && content) {
                    btn.classList.remove('text-primary', 'border-primary');
                    btn.classList.add('text-muted', 'border-transparent');
                    content.classList.remove('block');
                    content.classList.add('hidden');
                }
            }
            const activeBtn = document.getElementById(`tab-btn-${id}-${tabNum}`);
            const activeContent = document.getElementById(`tab-content-${id}-${tabNum}`);
            if(activeBtn && activeContent) {
                activeBtn.classList.remove('text-muted', 'border-transparent');
                activeBtn.classList.add('text-primary', 'border-primary');
                activeContent.classList.remove('hidden');
                activeContent.classList.add('block');
            }
        };

        // ─── FILTERS ───
        let filterMode = 'all'; // 'all', 'value', 'sharp'
        let searchQuery = '';

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            applyFilters();
        });
        document.getElementById('filter-value').addEventListener('click', (e) => {
            filterMode = filterMode === 'value' ? 'all' : 'value';
            e.target.classList.toggle('border-mk-green');
            e.target.classList.toggle('text-mk-green');
            document.getElementById('filter-sharp').classList.remove('border-purple-500', 'text-purple-500');
            applyFilters();
        });
        document.getElementById('filter-sharp').addEventListener('click', (e) => {
            filterMode = filterMode === 'sharp' ? 'all' : 'sharp';
            e.target.classList.toggle('border-purple-500');
            e.target.classList.toggle('text-purple-500');
            document.getElementById('filter-value').classList.remove('border-mk-green', 'text-mk-green');
            applyFilters();
        });

        function applyFilters() {
            document.querySelectorAll('.league-group').forEach(group => {
                let visibleCount = 0;
                group.querySelectorAll('.match-container').forEach(match => {
                    const txt = match.getAttribute('data-search') || '';
                    const edge = parseFloat(match.getAttribute('data-edge') || '0');
                    const sharp = match.getAttribute('data-sharp') || '';

                    let show = true;
                    if(searchQuery && !txt.includes(searchQuery)) show = false;
                    if(filterMode === 'value' && edge < 5) show = false;
                    if(filterMode === 'sharp' && !sharp.includes('STRONG') && !sharp.includes('ELITE')) show = false;

                    if(show) { match.classList.remove('hide'); visibleCount++; }
                    else { match.classList.add('hide'); }
                });
                
                if(visibleCount === 0) group.classList.add('hide');
                else group.classList.remove('hide');
            });
        }

        let activeTab = 'bulten';

        document.getElementById('tab-bulten').addEventListener('click', (e) => {
            activeTab = 'bulten';
            e.target.classList.add('border-mk-green', 'text-mk-green');
            e.target.classList.remove('mk-border', 'text-muted');
            const other = document.getElementById('tab-biten');
            other.classList.remove('border-mk-green', 'text-mk-green');
            other.classList.add('mk-border', 'text-muted');
            renderActiveTab();
        });

        document.getElementById('tab-biten').addEventListener('click', (e) => {
            activeTab = 'biten';
            e.target.classList.add('border-mk-green', 'text-mk-green');
            e.target.classList.remove('mk-border', 'text-muted');
            const other = document.getElementById('tab-bulten');
            other.classList.remove('border-mk-green', 'text-mk-green');
            other.classList.add('mk-border', 'text-muted');
            renderActiveTab();
        });

        function loadData() {
            try {
                const data = window.DASHBOARD_DATA;
                const signals = window.LIVE_SIGNALS || [];
                if (!data) return;
                
                renderKPIs(data.summary);
                
                // Append past bets to LIVE_SIGNALS for the Sonuçlananlar view
                const pastBets = data.bets || [];
                const finishedBets = pastBets.filter(b => b.is_win !== null).map(b => ({
                    ev: b.ev, dep: b.dep, lig: "Sonuçlananlar (Model)", date: b.date, 
                    selection: b.tahmin, target_odds: b.best_odds,
                    is_win: b.is_win, gercek_skor: b.gercek_skor, pnl: b.pnl,
                    edge_pct: b.edge * 100, odds: { ms1:0, ms0:0, ms2:0 },
                    sharp: {}, form: {}, opening_odds: {}
                }));
                
                const finishedMatches = data.finished_matches || [];
                const bitenMaclarObj = finishedMatches.map(m => ({
                    ev: m.ev || m.home, dep: m.dep || m.away, lig: m.lig || "?", date: m.tarih || m.date, 
                    selection: m.selection || m.prediction || "Biten Maç",
                    target_odds: m.target_odds || (m.odds ? m.odds.ms1 : 1.80),
                    is_win: m.is_win, gercek_skor: m.gercek_skor || m.skor || "v", pnl: m.pnl || 0,
                    verification_badge: m.verification_badge || (m.is_win ? "🎯 İSABETLİ TAHMİN" : (m.is_win === false ? "❌ MODEL YANILDI" : "⏳ BEKLİYOR")),
                    edge_pct: m.edge_pct || 8.5,
                    probs: m.probs || { ms1: 52.0, ms0: 26.0, ms2: 22.0, over25: 56.0, under25: 44.0, btts_yes: 54.0, btts_no: 46.0 },
                    odds: m.odds || { ms1: 1.92, ms0: 3.85, ms2: 4.55 },
                    xg: m.xg || { ev: 1.65, dep: 1.10, toplam: 2.75 },
                    sharp: m.sharp || { ms_sinyal: "YOK", ms_tier: "NO_SHARP" },
                    form: m.form || {}, opening_odds: m.opening_odds || {}
                }));

                
                window.ALL_BULTEN = [...signals, ...finishedBets];
                window.ALL_BITEN = bitenMaclarObj;
                
                renderKupon();
                renderActiveTab();
            } catch (err) {
                console.error("Data load failed", err);
            }
        }
        
        function renderActiveTab() {
            if (activeTab === 'bulten') {
                document.getElementById('filter-value').parentElement.classList.remove('hidden');
                document.getElementById('kupon-container').style.display = window.ALL_BULTEN.length > 0 ? '' : 'none';
                renderFixtures(window.ALL_BULTEN);
            } else {
                document.getElementById('filter-value').parentElement.classList.add('hidden');
                document.getElementById('kupon-container').style.display = 'none';
                renderFixtures(window.ALL_BITEN);
            }
        }

        function renderKPIs(summary) {
            const roiEl = document.getElementById('kpi-roi');
            roiEl.innerText = (summary.roi > 0 ? '+' : '') + (summary.roi||0).toFixed(2) + '%';
            roiEl.className = `text-sm font-bold ${summary.roi > 0 ? 'text-mk-green' : (summary.roi < 0 ? 'text-mk-red' : 'text-muted')}`;
            document.getElementById('kpi-bankroll').innerText = formatMoney(summary.final_br || 0);
            
            const badge = document.getElementById('verdict-badge');
            const verdict = summary.verdict || "AWAITING";
            badge.innerText = verdict;
            if(verdict.includes('PROFITABLE') || verdict.includes('POSITIVE')) {
                badge.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-mk-green/10 text-mk-green border border-mk-green/30";
            } else if (verdict.includes('BLEEDING')) {
                badge.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-mk-red/10 text-mk-red border border-mk-red/30";
            }
        }

        function generateFormHTML(formArr) {
            if(!formArr || formArr.length === 0) {
                return `<div class="form-box form-none">-</div>`.repeat(5);
            }
            let html = '';
            // Mackolik gibi en yeni maç en solda görünsün diye diziyi ters çeviriyoruz.
            [...formArr].reverse().forEach(r => {
                const cls = r === 'W' ? 'form-W' : (r === 'D' ? 'form-D' : 'form-L');
                const lbl = r === 'W' ? 'G' : (r === 'D' ? 'B' : 'M');
                html += `<div class="form-box ${cls}">${lbl}</div>`;
            });
            // fill up to 5 if needed
            for(let i=formArr.length; i<5; i++){
                html += `<div class="form-box form-none">-</div>`;
            }
            return html;
        }

        function createProgressBar(label, odds, aiProb, isValue) {
            const oddsProb = odds > 0 ? (1 / odds) * 100 : 0;
            const diff = aiProb - oddsProb;
            const barColor = isValue ? 'bg-mk-green' : 'bg-mk-yellow';
            
            return `
            <div class="mb-3">
                <div class="flex justify-between text-xs mb-1">
                    <span class="font-bold text-secondary">${label} <span class="text-muted font-normal">(Oran: ${odds > 0 ? odds.toFixed(2) : '-'})</span></span>
                    <span class="font-bold ${isValue ? 'text-mk-green' : 'text-muted'}">%${(aiProb||0).toFixed(1)}</span>
                </div>
                <div class="progress-bar-bg relative">
                    <div class="absolute top-0 bottom-0 border-r-2 border-primary z-10 opacity-30" style="left: ${Math.min(100, Math.max(0, oddsProb))}%;" title="İddaa Olasılığı: %${oddsProb.toFixed(1)}"></div>
                    <div class="progress-bar-fill ${barColor}" style="width: ${Math.min(100, Math.max(0, aiProb))}%;"></div>
                </div>
                ${diff > 0 && odds > 0 ? `<div class="text-[9px] text-right text-mk-green mt-0.5">+%${diff.toFixed(1)} Değer (Edge)</div>` : `<div class="h-3"></div>`}
            </div>`;
        }

        function renderKupon() {
            const kContainer = document.getElementById('kupon-container');
            const kData = window.DASHBOARD_DATA.kupon;
            if(!kData || !kData.maclar || kData.maclar.length === 0) {
                kContainer.classList.add('hidden');
                return;
            }
            kContainer.classList.remove('hidden');

            let html = `
                <div class="bg-gradient-to-r from-yellow-500 to-yellow-600 px-3 py-2 flex justify-between items-center text-white">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">🏆</span>
                        <span class="font-bold uppercase tracking-wide text-sm">Günün Yapay Zeka Kombinesi</span>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] uppercase opacity-80">Toplam Oran</div>
                        <div class="font-black text-lg">${kData.toplam_oran.toFixed(2)}</div>
                    </div>
                </div>
                <div class="p-3">
            `;

            kData.maclar.forEach(m => {
                html += `
                    <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 py-2 last:border-0">
                        <div>
                            <div class="text-sm font-bold text-primary">${m.ev} - ${m.dep}</div>
                            <div class="text-[11px] text-muted">${m.tahmin}</div>
                        </div>
                        <div class="text-sm font-bold bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200 px-2 py-0.5 rounded">
                            ${m.oran.toFixed(2)}
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="mt-2 pt-2 border-t border-gray-200 dark:border-gray-700 flex justify-between text-[11px] text-muted">
                    <span>Kazanma İhtimali: <strong class="text-primary">%${kData.kazanma_ihtimali}</strong></span>
                    <span>Beklenen Değer (Edge): <strong class="text-primary">%${kData.beklenen_deger}</strong></span>
                </div>
                </div>
            `;
            kContainer.innerHTML = html;
        }

        function renderFixtures(signalsToRender) {
            const container = document.getElementById('fixture-container');
            container.innerHTML = '';

            const matchMap = new Map();
            signalsToRender.forEach((m, idx) => {
                const key = m.ev + "_" + m.dep;
                if(!matchMap.has(key)) matchMap.set(key, {...m, id: idx});
            });

            const allMatches = Array.from(matchMap.values());
            allMatches.sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

            const grouped = {};
            allMatches.forEach(m => {
                const lig = m.lig || "Diğer";
                const dateObj = new Date(m.date);
                const dateKey = !isNaN(dateObj) ? dateObj.toLocaleDateString('tr-TR', {day: 'numeric', month: 'long', year: 'numeric'}) : '';
                const groupKey = `${dateKey} - ${lig}`;
                if(!grouped[groupKey]) grouped[groupKey] = [];
                grouped[groupKey].push(m);
            });

            if(Object.keys(grouped).length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-muted text-sm">Günün bülteninde analiz edilecek maç bulunmamaktadır.</div>`;
                return;
            }

            let html = '';
            let idCounter = 0;

            for(const [groupTitle, matches] of Object.entries(grouped)) {
                html += `<div class="league-group">`;
                html += `
                    <div class="mk-bg-header border-b mk-border px-3 py-1.5 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-1 h-3 bg-mk-red"></div>
                            <span class="text-[11px] font-bold text-secondary uppercase">${groupTitle}</span>
                        </div>
                        <div class="hidden md:flex gap-1 pr-1 text-[10px] text-muted font-bold w-[124px] justify-between">
                            <span class="w-[38px] text-center">1</span>

                                                <div class="text-xl font-black text-mk-green">${h2h.ev_wins}</div>
                                            </div>
                                            <div class="flex-1 border-x mk-border">
                                                <div class="text-[10px] text-muted font-bold mb-1">Beraberlik</div>
                                                <div class="text-xl font-black text-gray-500">${h2h.draws}</div>
                                            </div>
                                            <div class="flex-1">
                                                <div class="text-[10px] text-muted font-bold mb-1 truncate">${m.dep}</div>
                                                <div class="text-xl font-black text-blue-500">${h2h.dep_wins}</div>
                                            </div>
                                        </div>
                                        <div class="text-[11px] font-bold text-muted uppercase tracking-wider mb-3">Geçmiş Maçlar</div>
                                        <div class="flex flex-col gap-2">
                                            ${h2h_matches.length > 0 ? h2h_matches.map(h => `
                                                <div class="flex items-center justify-between bg-white dark:bg-[#111214] p-2 rounded border mk-border text-xs">
                                                    <div class="w-20 text-muted">${h.date}</div>
                                                    <div class="flex-1 text-right font-bold ${h.home === m.ev ? 'text-primary' : 'text-secondary'} truncate">${h.home}</div>
                                                    <div class="px-2 py-1 bg-gray-100 dark:bg-[#202124] rounded mx-2 font-black">${h.score}</div>
                                                    <div class="flex-1 text-left font-bold ${h.away === m.dep ? 'text-primary' : 'text-secondary'} truncate">${h.away}</div>
                                                </div>
                                            `).join('') : '<div class="text-xs text-muted italic text-center py-4">Aralarında daha önce oynanmış kayıtlı maç bulunamadı.</div>'}
                                        </div>
                                    </div>

                                    <!-- TAB 4: Maçlar (Form Detayları) -->
                                    <div id="tab-content-${idCounter}-4" class="hidden">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <!-- EV Son 5 -->
                                            <div>
                                                <div class="flex items-center gap-2 mb-3">
                                                    <img src="${evLogo}" class="w-6 h-6 rounded-full object-cover">
                                                    <div class="text-[12px] font-bold text-primary uppercase">${m.ev} Son 5 Maç</div>
                                                </div>
                                                <div class="flex flex-col gap-2">
                                                    ${evSt.recent.length > 0 ? evSt.recent.map(r => `
                                                        <div class="flex items-center justify-between bg-white dark:bg-[#111214] p-2 rounded border mk-border text-[11px]">
                                                            <div class="w-16 text-muted truncate">${r.date}</div>
                                                            <div class="flex-1 text-center font-bold text-secondary truncate">${r.opponent} ${r.isHome ? '<span class="text-[9px] text-muted">(Ev)</span>' : '<span class="text-[9px] text-muted">(Dep)</span>'}</div>
                                                            <div class="px-2 py-0.5 mx-1 font-black rounded text-white ${r.result === 'W' ? 'bg-mk-green' : (r.result === 'D' ? 'bg-gray-500' : 'bg-mk-red')}">${r.score}</div>
                                                        </div>
                                                    `).join('') : '<div class="text-[11px] text-muted italic">Veri bulunamadı.</div>'}
                                                </div>
                                            </div>

                                            <!-- DEP Son 5 -->
                                            <div>
                                                <div class="flex items-center gap-2 mb-3">
                                                    <img src="${depLogo}" class="w-6 h-6 rounded-full object-cover">
                                                    <div class="text-[12px] font-bold text-primary uppercase">${m.dep} Son 5 Maç</div>
                                                </div>
                                                <div class="flex flex-col gap-2">
                                                    ${depSt.recent.length > 0 ? depSt.recent.map(r => `
                                                        <div class="flex items-center justify-between bg-white dark:bg-[#111214] p-2 rounded border mk-border text-[11px]">
                                                            <div class="w-16 text-muted truncate">${r.date}</div>
                                                            <div class="flex-1 text-center font-bold text-secondary truncate">${r.opponent} ${r.isHome ? '<span class="text-[9px] text-muted">(Ev)</span>' : '<span class="text-[9px] text-muted">(Dep)</span>'}</div>
                                                            <div class="px-2 py-0.5 mx-1 font-black rounded text-white ${r.result === 'W' ? 'bg-mk-green' : (r.result === 'D' ? 'bg-gray-500' : 'bg-mk-red')}">${r.score}</div>
                                                        </div>
                                                    `).join('') : '<div class="text-[11px] text-muted italic">Veri bulunamadı.</div>'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
            applyFilters();
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
